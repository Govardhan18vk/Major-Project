<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc">
  <title id="title">SafeTask detailed data flow</title>
  <desc id="desc">Sequence diagram showing data flow from the user through Streamlit, the agent loop, tools, in-memory data, security checks, simulated email, safety analysis, and final UI output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <marker id="darrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546e7a"/>
    </marker>
    <style>
      .title{font:700 28px Arial;fill:#102027}.head{font:700 18px Arial;fill:#102027}.small{font:14px Arial;fill:#263238}.tiny{font:12px Arial;fill:#37474f}.life{stroke:#248b45;stroke-width:12}.dash{stroke:#90a4ae;stroke-width:2;stroke-dasharray:8 8}.call{stroke:#263238;stroke-width:2;fill:none;marker-end:url(#arrow)}.return{stroke:#546e7a;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#darrow)}.box{fill:#d8efd2;stroke:#a5c99e}.alt{fill:#fffde7;stroke:#8d8d6b}.branch{fill:#ffebee;stroke:#c62828}.note{fill:#eceff1;stroke:#90a4ae}
    </style>
  </defs>
  <rect width="1500" height="1160" fill="#fafafa"/>
  <text x="750" y="42" text-anchor="middle" class="title">SafeTask Agent - Detailed Data Flow</text>
  <text x="750" y="68" text-anchor="middle" class="small">One run from task submission to final answer; every run starts with isolated in-memory state</text>

  <g transform="translate(45,90)">
    <rect x="0" y="0" width="155" height="58" class="box"/><text x="77" y="35" text-anchor="middle" class="head">Acting User</text>
    <rect x="220" y="0" width="180" height="58" class="box"/><text x="310" y="35" text-anchor="middle" class="head">Streamlit UI</text>
    <rect x="465" y="0" width="190" height="58" class="box"/><text x="560" y="35" text-anchor="middle" class="head">Agent Loop</text>
    <rect x="720" y="0" width="190" height="58" class="box"/><text x="815" y="35" text-anchor="middle" class="head">Tool Registry</text>
    <rect x="975" y="0" width="190" height="58" class="box"/><text x="1070" y="35" text-anchor="middle" class="head">In-memory State</text>
    <rect x="1230" y="0" width="190" height="58" class="box"/><text x="1325" y="35" text-anchor="middle" class="head">LLM / Groq</text>

    <line x1="77" y1="58" x2="77" y2="1010" class="dash"/><line x1="310" y1="58" x2="310" y2="1010" class="dash"/><line x1="560" y1="58" x2="560" y2="1010" class="dash"/><line x1="815" y1="58" x2="815" y2="1010" class="dash"/><line x1="1070" y1="58" x2="1070" y2="1010" class="dash"/><line x1="1325" y1="58" x2="1325" y2="1010" class="dash"/>
    <rect x="71" y="110" width="12" height="90" class="life"/><rect x="304" y="145" width="12" height="140" class="life"/><rect x="554" y="210" width="12" height="620" class="life"/><rect x="809" y="360" width="12" height="240" class="life"/><rect x="1064" y="305" width="12" height="390" class="life"/><rect x="1319" y="230" width="12" height="90" class="life"/>

    <path d="M83 120 L304 120" class="call"/><text x="190" y="112" text-anchor="middle" class="small">task, user, settings</text>
    <path d="M316 165 L554 165" class="call"/><text x="435" y="157" text-anchor="middle" class="small">run_agent(...)</text>
    <path d="M566 230 L809 230" class="call"/><text x="688" y="222" text-anchor="middle" class="small">ask for next decision</text>
    <path d="M821 255 L1319 255" class="call"/><text x="1070" y="247" text-anchor="middle" class="small">task + tool history</text>
    <path d="M1319 285 L821 285" class="return"/><text x="1070" y="278" text-anchor="middle" class="small">one tool call or final answer</text>
    <path d="M809 380 L566 380" class="call"/><text x="688" y="372" text-anchor="middle" class="small">dispatch selected tool</text>
    <path d="M566 410 L1064 410" class="call"/><text x="815" y="402" text-anchor="middle" class="small">read or mutate State</text>
    <path d="M1064 450 L809 450" class="return"/><text x="936" y="442" text-anchor="middle" class="small">structured result</text>
    <path d="M809 490 L566 490" class="return"/><text x="688" y="482" text-anchor="middle" class="small">tool result appended to history</text>
    <path d="M566 520 L1319 520" class="call"/><text x="940" y="512" text-anchor="middle" class="small">result becomes next LLM context</text>

    <rect x="410" y="550" width="730" height="250" class="alt"/>
    <text x="430" y="578" class="head">Tool branches selected by the LLM</text>
    <path d="M566 610 L809 610" class="call"/><text x="688" y="602" text-anchor="middle" class="small">security: authenticate / permission</text>
    <path d="M809 640 L1064 640" class="call"/><text x="936" y="632" text-anchor="middle" class="small">lookup: employee, file, database</text>
    <path d="M566 670 L809 670" class="call"/><text x="688" y="662" text-anchor="middle" class="small">email: draft / recipient check / send</text>
    <path d="M809 700 L1064 700" class="call"/><text x="936" y="692" text-anchor="middle" class="small">audit: append action record</text>
    <text x="430" y="744" class="tiny">The same state object is used for every tool in this run.</text>
    <text x="430" y="766" class="tiny">Checks are available tools, not automatic enforcement gates.</text>

    <path d="M566 840 L310 840" class="return"/><text x="438" y="832" text-anchor="middle" class="small">final answer or stop message</text>
    <path d="M310 870 L83 870" class="return"/><text x="196" y="862" text-anchor="middle" class="small">display trajectory and answer</text>

    <rect x="70" y="905" width="1050" height="95" class="branch"/>
    <text x="95" y="933" class="head">UNSAFE or ERROR branch</text>
    <text x="95" y="957" class="small">Sensitive action before authentication, permission, or recipient checks is still simulated.</text>
    <text x="95" y="979" class="small">API errors become a stop message; tool errors are recorded in history; 12 steps ends the run.</text>
  </g>
</svg>
